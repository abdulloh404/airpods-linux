[workspace]
resolver = "3"
members = [
    "crates/airpods-core",
    "crates/airpods-audio",
    "crates/airpods-ipc",
    "crates/airpodsd",
    "crates/airpodsctl",
    "crates/airpods-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Abdulloh"]

[workspace.dependencies]
anyhow = "1.0"
bluer = { version = "0.17.4", features = ["bluetoothd", "l2cap"] }
clap = { version = "4.6.6", features = ["derive"] }
futures-util = "0.3"
gio = "0.22.8"
glib = "0.22.8"
gtk4 = { version = "0.11.4", features = ["v4_6"] }
libc = "0.2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9.12"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
zvariant = "5.15.0"
